{% extends 'base.html' %}
{% block content %}
<h3>文章管理</h3>
<table class="table">
  <thead><tr><th>ID</th><th>标题</th><th>作者</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
    {% for a in page_obj %}
    <tr id="article-{{ a.id }}">
      <td>{{ a.id }}</td>
      <td><a href="{% url 'articles:article_detail' slug=a.slug %}">{{ a.title }}</a></td>
      <td>{{ a.author.username }}</td>
      <td>{{ a.status }}</td>
      <td>
        <a class="btn btn-sm btn-primary" href="{% url 'core:admin_edit_article' a.id %}">编辑</a>
        <button class="btn btn-sm btn-danger delete-article" data-id="{{ a.id }}">删除</button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<nav>
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}">上一页</a>{% endif %}
  <span> 第 {{ page_obj.number }} 页 </span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}">下一页</a>{% endif %}
</nav>
<script>
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.delete-article').forEach(btn=>{
    btn.addEventListener('click', function(){
      if(!confirm('确认删除？')) return;
      const id = this.dataset.id;
      fetch(`{% url 'core:admin_delete_article' 0 %}`.replace('/0/','/'+id+'/'), {method:'POST', headers:{'X-CSRFToken': getCookie('csrftoken')}})
        .then(r=>r.json()).then(d=>{ if(d.success) location.reload(); else alert('删除失败'); }).catch(()=>alert('网络错误'));
    });
  });
});
function getCookie(name){ return document.cookie.split('; ').find(c=>c.startsWith(name+'='))?.split('=')[1]; }
</script>
{% endblock %}
