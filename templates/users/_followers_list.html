{% load static %}

<div class="list-group">
    {% for user in followers %}
        <a href="{% url 'users:user_profile' user.username %}" class="list-group-item list-group-item-action d-flex align-items-center mb-2 shadow-sm rounded">
            
            <!-- 用户头像 -->
            {% if user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" class="rounded-circle me-3" width="50" height="50" onerror="this.onerror=null;this.src='{% static 'images/default_avatar.jpg' %}'">
            {% elif user.avatar %}
                <img src="{{ user.avatar.url }}" class="rounded-circle me-3" width="50" height="50" onerror="this.onerror=null;this.src='{% static 'images/default_avatar.jpg' %}'">
            {% else %}
                <img src="{% static 'images/default_avatar.jpg' %}" class="rounded-circle me-3" width="50" height="50">
            {% endif %}
            
            <!-- 用户名 -->
            <span class="fw-semibold">{{ user.username }}</span>
        </a>
    {% empty %}
        <p class="text-muted text-center">还没有粉丝。</p>
    {% endfor %}
</div>
